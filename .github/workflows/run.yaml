
name: Iris Model Training CICD

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  model-training:
    runs-on: ubuntu-24.04

    steps:

      # Step 1: Checkout GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      # Step 3: Verify project files
      - name: Check project files
        run: |
          echo "Checking repository files..."
          ls -lah

          test -f iris.csv
          test -f requirements.txt
          test -f train_model.py

      # Step 4: Install system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libjpeg-dev \
            libpango1.0-dev \
            libgif-dev \
            librsvg2-dev

      # Step 5: Install Python libraries
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 6: Train ML models
      - name: Run model training
        run: |
          echo "Starting Iris dataset model training..."
          python train_model.py

      # Step 7: Display model scores
      - name: Display model scores
        run: |
          echo "========== MODEL PERFORMANCE =========="

          if [ -f scores.txt ]; then
            cat scores.txt
          else
            echo "ERROR: scores.txt not generated!"
            exit 1
          fi

      # Step 8: Verify output images
      - name: Verify generated images
        run: |
          test -f ConfusionMatrix.png
          test -f FeatureImportance.png
          echo "All output files generated successfully."

      # Step 9: Generate ML report
      - name: Generate model report
        run: |
          echo "# Iris Dataset - ML Model Report" > report.md

          echo "## Model Performance" >> report.md
          cat scores.txt >> report.md

          echo "" >> report.md
          echo "## Confusion Matrix" >> report.md
          echo "![](./ConfusionMatrix.png)" >> report.md

          echo "" >> report.md
          echo "## Feature Importance" >> report.md
          echo "![](./FeatureImportance.png)" >> report.md

          cat report.md

      # Step 10: Publish report on Pull Request
      - name: Publish CML report
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md

      # Step 11: Upload training results
      - name: Upload ML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Iris-ML-Training-Results
          path: |
            scores.txt
            ConfusionMatrix.png
            FeatureImportance.png
            report.md
          if-no-files-found: warn
          retention-days: 7
